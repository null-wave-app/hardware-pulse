name: 不具合報告
description: Hardware Pulseで起きた問題を報告します。
title: "[不具合] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "画像やログから個人情報・PC名・公開したくない機種情報を削除してください。"
  - type: input
    id: version
    attributes:
      label: アプリのバージョン
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windowsのバージョン（任意）
      placeholder: Windows 11 x64
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 追加情報（任意）
      description: 関係する設定や、個人情報を削除した画像など。
